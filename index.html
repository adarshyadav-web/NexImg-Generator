<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexImg | Infinite Inspiration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Random Image Generator</h1>
            <p>Generate high-quality random images for your next project</p>
            <div class="controls">
                <input type="number" id="img-count" value="4" min="1" max="12">
                <select id="category">
                    <option value="nature">Nature</option>
                    <option value="tech">Technology</option>
                    <option value="architecture">Architecture</option>
                    <option value="animals">Animals</option>
                </select>
                <button id="generate-btn">Generate <i class="fa-solid fa-wand-magic-sparkles"></i></button>
            </div>
        </header>

        <main id="image-grid" class="image-grid">
            <!-- Images will be injected here -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
